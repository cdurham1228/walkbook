  .result-label { font-size:14px; color:var(--muted); flex:1; min-width:0; }

  .result-value { font-size:20px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tiles { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-top:4px; }

  .tile-icon { font-size:22px; margin-bottom:8px; }
  .tile-name { font-size:15px; font-weight:700; letter-spacing:-0.01em; }

  .back-btn { background:var(--panel); border:none; color:var(--text); padding:8px 14px; border-radius:10px; font-size:15px; font-weight:600; }

  .section-label { font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin:16px 0 8px; padding:0 2px; }
  .section-label:first-child { margin-top:0; }
  .stat-card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:8px; }
  .stat-row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .stat-row + .stat-row { margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .stat-name { font-size:14px; color:var(--muted); flex:1; }
  .stat-name strong { display:block; color:var(--text); font-size:16px; font-weight:600; margin-bottom:2px; }
  .stat-name span { font-size:11px; }
  .stat-val { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; }
  .stat-val.big { font-size:28px; }
  .stat-meta { font-size:12px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
  .delta-pos { color:var(--green); }
  .delta-neg { color:var(--red); }
  .delta-warn { color:var(--amber); }
  .quad { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .quad-cell { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; }
  .quad-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; font-weight:600; }
  .quad-val { font-size:22px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; }

  .dept-row { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:baseline; padding:10px 14px; background:var(--panel); border:1px solid var(--border); border-radius:10px; margin-bottom:6px; }

  .toggle-row { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .toggle { flex:1; padding:9px 6px; background:var(--panel); border:1px solid var(--border); border-radius:10px; color:var(--muted); font-size:12px; font-weight:600; text-align:center; cursor:pointer; min-width:0; }

  .day-cell { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px 4px; text-align:center; }
  .day-dow { font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; }
  .day-num { font-size:13px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }

  .note { font-size:12px; color:var(--muted); margin:8px 0; line-height:1.5; }
  .empty { padding:20px; text-align:center; color:var(--muted); font-size:14px; }

const fmt$ = n => { if(n==null||isNaN(n))return "—"; const a=Math.abs(n),s=n<0?"-":""; if(a>=1e6)return s+"$"+(a/1e6).toFixed(2)+"M"; if(a>=1e3)return s+"$"+(a/1e3).toFixed(1)+"K"; return s+"$"+Math.round(a).toLocaleString(); };
const fmt$full = n => { if(n==null||isNaN(n))return "—"; return (n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString(); };
const fmtN = (n,dec=0) => { if(n==null||isNaN(n))return "—"; return Number(n).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec}); };
const fmtPct = (n,dec=1) => { if(n==null||isNaN(n))return "—"; return (n*100).toFixed(dec)+"%"; };
const fmtPctRaw = (n,dec=1) => { if(n==null||isNaN(n))return "—"; return Number(n).toFixed(dec)+"%"; };
const deltaClass = (n,inv=false) => { if(n===0||n==null)return ""; return (inv?n<0:n>0)?"delta-pos":"delta-neg"; };
const arrow = n => n>0?"▲":n<0?"▼":"·";

function panelTitle(p) { return ({sales:"Sales",lastweek:"Last Week",lastperiod:"Last Period (P9)",payroll:"Payroll",membership:"Membership",depts:"Departments",fresh:"Fresh",shrink:"Shrink & D&D",ancillary:"Ancillary"})[p]||""; }
function renderPanel(name) { document.getElementById("panelTitle").textContent = panelTitle(name); document.getElementById("panelBody").innerHTML = panelHTML[name](); document.getElementById("panelBody").scrollTop = 0; }

  },

function membershipPeriod(p) {
  const m = DATA.membership[p];
  const row = (lbl,val,inc,isPct=false,isCount=false) => {
    if (val===undefined) return "";
    const display = isPct ? fmtPct(val,1) : (isCount ? fmtN(val) : fmt$(val));
    return `<div class="stat-row"><div class="stat-name"><strong>${lbl}</strong></div><div><div class="stat-val">${display}</div>${inc!==undefined?`<div class="stat-meta ${deltaClass(inc)}">${fmtPct(inc)} vs LY</div>`:""}</div></div>`;
  };
  return `<div class="stat-card">${row("Member Income",m.memberIncome.ty,m.memberIncome.inc)}${row("Gold Signups",m.goldSignups.ty,m.goldSignups.inc,false,true)}${row("Business Signups",m.bizSignups.ty,m.bizSignups.inc,false,true)}${row("Reactivations",m.reactivations.ty,m.reactivations.inc,false,true)}${row("Total Signups+Reactivations",m.total.ty,m.total.inc,false,true)}</div><div class="stat-card">${row("New Member Exec %",m.newMemberExecPct.ty,m.newMemberExecPct.inc,true)}${row("Exec Upgrades",m.execUpgrades.ty,m.execUpgrades.inc,false,true)}${row("Triple Play %",m.triplePlay.ty,m.triplePlay.inc,true)}${row("NMAR %",m.nmarPct.ty,m.nmarPct.inc,true)}</div><div class="stat-card">${row("Credit Card Apps",m.creditCardApps.ty,m.creditCardApps.inc,false,true)}${row("New Member CC %",m.newMemberCCPct.ty,m.newMemberCCPct.inc,true)}${row("New Member Email %",m.newMemberEmailPct.ty,m.newMemberEmailPct.inc,true)}</div>`;
}

function deptList(period) {
  const incKey = period==="daily" ? null : period+"Inc";
  const sorted = [...DATA.departments].sort((a,b) => parseInt(a.code)-parseInt(b.code));
  return sorted.map(d => {
    const val = d[period], inc = incKey ? d[incKey] : null;
    return `<div class="dept-row"><div class="dept-name">${d.code} ${d.name}</div><div class="dept-sales">${fmt$(val)}</div><div class="dept-inc ${inc!==null?deltaClass(inc):''}">${inc!==null?fmtPct(inc):'—'}</div></div>`;
  }).join("");
}

d.ytdProfit.ty<0?'delta-neg':'delta-pos'}">${fmt$(d.ytdProfit.ty)}</div></div></div></div><div class="section-label">Top 10 Items — Week</div>${d.topItems.map(i=>`<div class="top-item"><div class="rank">#${i.rank}</div><div class="item-name">${i.name}<div style="font-size:11px;color:var(--muted);margin-top:2px">${fmtN(i.units)} units</div></div><div class="item-sales">${fmt$(i.sales)}</div></div>`).join("")}`;

name"><strong>Payroll</strong><span>not allocated</span></div><div><div class="stat-val">—</div></div></div>`}<div class="stat-row"><div class="stat-name"><strong>Whse Salvage/D&D</strong><span>${fmtPctRaw(d.dd.pct,2)} of sales</span></div><div><div class="stat-val ${d.dd.ty<0?'delta-neg':''}">${fmt$(d.dd.ty)}</div></div></div><div class="stat-row"><div class="stat-name"><strong>Fresh Op Shrink/Overage</strong><span>${fmtPctRaw(d.shrink.pct,2)} of sales</span></div><div><div class="stat-val ${d.shrink.ty<0?'delta-neg':'delta-pos'}">${fmt$(d.shrink.ty)}</div></div></div>${d.reprocess?`<div class="stat-row"><div class="stat-name"><strong>Reprocess</strong><span>${fmtPctRaw(d.reprocess.pct,2)} of sales</span></div><div><div class="stat-val delta-neg">${fmt$(d.reprocess.ty)}</div></div></div>`:""}</div><div class="section-label">Top 10 Items — Week</div>${d.topItems.map(i=>`<div class="top-item"><div class="rank">#${i.rank}</div><div class="item-name">${i.name}<div style="font-size:11px;color:var(--muted);margin-top:2px">${fmtN(i.units)} units</div></div><div class="item-sales">${fmt$(i.sales)}</div></div>`).join("")}`;
}

function buildSearchIndex() {

  idx.push({keys:["wtd","week to date","running"],label:"Total Sales — Running Wk",value:fmt$full(s.wtd.ty),sub:`${fmtPct(s.wtd.inc)} vs LY`});
  idx.push({keys:["ptd","period"],label:"Total Sales — PTD",value:fmt$full(s.ptd.ty),sub:`${fmtPct(s.ptd.inc)} vs LY`});
  idx.push({keys:["ytd","year"],label:"Total Sales — YTD",value:fmt$full(s.ytd.ty),sub:`${fmtPct(s.ytd.inc)} vs LY`});
  idx.push({keys:["merch"],label:"Merch Sales — YTD",value:fmt$full(s.merch.ytd.ty),sub:`${fmtPct(s.merch.ytd.inc)} vs LY`});

  idx.push({keys:["avg sale","basket"],label:"Avg Sale — Yesterday",value:"$"+s.avgSales.daily.ty,sub:`${fmtPct(s.avgSales.daily.inc)} vs LY`});
  const w = DATA.lastWeek.weekly;
  idx.push({keys:["last week","lw"],label:"Last Week Total",value:fmt$full(w.totalSales.actual),sub:`Plan ${fmt$(w.totalSales.plan)}`});
  idx.push({keys:["last week hours"],label:"Last Week Hours",value:fmtN(w.hours.actual,0),sub:`Sch ${fmtN(w.hours.schedule,0)}`});
  idx.push({keys:["last week wage"],label:"Last Week Avg Wage",value:"$"+w.avgWage.actual.toFixed(2),sub:`LY $${w.avgWage.ly.toFixed(2)}`});
  const lp = DATA.lastPeriod;

  idx.push({keys:["last period controllable"],label:"Last Period Controllable Profit",value:fmt$full(lp.profit.controllable.ty),sub:`${fmtPctRaw(lp.profit.controllable.varLY,1)}% vs LY`});
  const p = DATA.payroll;

  idx.push({keys:["payroll %","wage %","merch pay","merch payroll"],label:"Merch Payroll %",value:fmtPctRaw(p.pctActual*100,2),sub:`Plan ${fmtPctRaw(p.pctPlan*100,2)}`});

  idx.push({keys:["productivity"],label:"Productivity",value:"$"+p.productivity,sub:"sales per hour"});
  const m = DATA.membership;
  idx.push({keys:["signups"],label:"Signups+React — PTD",value:fmtN(m.ptd.total.ty),sub:`${fmtPct(m.ptd.total.inc)} vs LY`});
  idx.push({keys:["exec upgrades"],label:"Exec Upgrades — PTD",value:fmtN(m.ptd.execUpgrades.ty),sub:""});
  idx.push({keys:["nmar"],label:"New Member Exec %",value:fmtPct(m.ptd.newMemberExecPct.ty),sub:""});

  idx.push({keys:["pt","part time"],label:"Part Time Count",value:m.ftpt.pt,sub:fmtPct(m.ftpt.ptPct)});
  const f = DATA.fresh;
  idx.push({keys:["fresh"],label:"Fresh Total Sales (P9)",value:fmt$full(f.total.sales.ty),sub:`${fmtPctRaw(f.total.sales.varLY,1)}% vs LY`});

  idx.push({keys:["pharm otc","otc"],label:"Pharmacy OTC (P9)",value:fmt$full(a.pharmOtc.sales),sub:`Profit ${fmt$(a.pharmOtc.profit)}`});
  idx.push({keys:["optical"],label:"Optical (P9)",value:fmt$full(a.optical.sales),sub:`Profit ${fmt$(a.optical.profit)}`});
  idx.push({keys:["hearing"],label:"Hearing Aids (P9)",value:fmt$full(a.hearing.sales),sub:`Profit ${fmt$(a.hearing.profit)}`});
  return idx;
}

const searchIndex = buildSearchIndex();
function search(q) {
  q = q.toLowerCase().trim();
  if (!q) return [];
  const tokens = q.split(/\s+/);
  const matches = searchIndex.filter(item => tokens.every(t => item.keys.some(k => k.includes(t)) || item.label.toLowerCase().includes(t)));
  matches.sort((a,b) => {
    const aS = a.keys.some(k=>k.startsWith(q)) || a.label.toLowerCase().startsWith(q);
    const bS = b.keys.some(k=>k.startsWith(q)) || b.label.toLowerCase().startsWith(q);
    if (aS && !bS) return -1;
    if (bS && !aS) return 1;
    return a.label.length - b.label.length;
  });
  return matches.slice(0, 12);
}

document.getElementById("dataAsOf").innerHTML = `Dash ${DATA.asOfDashboard} · PARIS ${DATA.asOfParis}<br>P&L ${DATA.asOfFinancial}`;
document.querySelectorAll(".tile").forEach(t => {
  t.addEventListener("click", () => {
    renderPanel(t.dataset.panel);
    document.getElementById("panelView").classList.add("active");
    setTimeout(attachPanelInteractions, 30);
  });
});
document.getElementById("backBtn").addEventListener("click", () => { document.getElementById("panelView").classList.remove("active"); });

function attachPanelInteractions() {
  const memToggle = document.getElementById("memToggle");
  if (memToggle) { memToggle.querySelectorAll(".toggle").forEach(t => { t.addEventListener("click", () => { memToggle.querySelectorAll(".toggle").forEach(x => x.classList.remove("active")); t.classList.add("active"); document.getElementById("memContent").innerHTML = membershipPeriod(t.dataset.period); }); }); }
  const deptToggle = document.getElementById("deptToggle");
  if (deptToggle) { deptToggle.querySelectorAll(".toggle").forEach(t => { t.addEventListener("click", () => { deptToggle.querySelectorAll(".toggle").forEach(x => x.classList.remove("active")); t.classList.add("active"); document.getElementById("deptList").innerHTML = deptList(t.dataset.period); }); }); }
  const freshToggle = document.getElementById("freshToggle");
  if (freshToggle) { freshToggle.querySelectorAll(".toggle").forEach(t => { t.addEventListener("click", () => { freshToggle.querySelectorAll(".toggle").forEach(x => x.classList.remove("active")); t.classList.add("active"); document.getElementById("freshContent").innerHTML = freshContent(t.dataset.cat); }); }); }
}

const searchEl = document.getElementById("search");
const resultsEl = document.getElementById("results");
searchEl.addEventListener("input", () => {
  const q = searchEl.value;
  if (!q.trim()) { resultsEl.classList.remove("active"); resultsEl.innerHTML = ""; return; }
  const matches = search(q);
  if (matches.length === 0) { resultsEl.innerHTML = '<div class="empty">No matches.</div>'; }
  else { resultsEl.innerHTML = matches.map(m => `<div class="result"><div class="result-label"><strong>${m.label}</strong>${m.sub?`<span style="font-size:12px;color:var(--muted)">${m.sub}</span>`:''}</div><div class="result-value">${m.value}</div></div>`).join(""); }
  resultsEl.classList.add("active");
});
searchEl.addEventListener("focus", () => { if (searchEl.value.trim()) resultsEl.classList.add("active"); });
</script>
