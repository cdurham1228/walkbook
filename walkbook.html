const fmt$=n=>{if(n==null||isNaN(n))return"—";const a=Math.abs(n),s=n<0?"-":"";if(a>=1e6)return s+"$"+(a/1e6).toFixed(2)+"M";if(a>=1e3)return s+"$"+(a/1e3).toFixed(1)+"K";return s+"$"+Math.round(a).toLocaleString()};
const fmt$full=n=>{if(n==null||isNaN(n))return"—";return(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString()};
const fmtN=(n,dec=0)=>{if(n==null||isNaN(n))return"—";return Number(n).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec})};
const fmtPct=(n,dec=1)=>{if(n==null||isNaN(n))return"—";return(n*100).toFixed(dec)+"%"};
const fmtPctRaw=(n,dec=1)=>{if(n==null||isNaN(n))return"—";return Number(n).toFixed(dec)+"%"};
const deltaClass=(n,inv=false)=>{if(n===0||n==null)return"";return(inv?n<0:n>0)?"delta-pos":"delta-neg"};
const arrow=n=>n>0?"▲":n<0?"▼":"·";

function panelTitle(p){return({sales:"Sales",lastweek:"Last Week",lastperiod:"Last Period (P9)",payroll:"Payroll",membership:"Membership",depts:"Departments",categories:"Categories",fresh:"Fresh",shrink:"Shrink & D&D",ancillary:"Ancillary"})[p]||""}
function renderPanel(name){document.getElementById("panelTitle").textContent=panelTitle(name);document.getElementById("panelBody").innerHTML=panelHTML[name]();document.getElementById("panelBody").scrollTop=0}

const panelHTML={
sales:()=>{const s=DATA.sales;const q=(o,l)=>`<div class="section-label">${l}</div><div class="quad">${["daily","wtd","ptd","ytd"].map(k=>`<div class="quad-cell"><div class="quad-label">${k==="daily"?"Yesterday":k==="wtd"?"Running Wk":k.toUpperCase()}</div><div class="quad-val">${fmt$(o[k].ty)}</div><div class="quad-sub ${deltaClass(o[k].inc)}">${arrow(o[k].inc)} ${fmtPct(o[k].inc)}</div></div>`).join("")}</div>`;return q({daily:s.daily,wtd:s.wtd,ptd:s.ptd,ytd:s.ytd},"Total Sales")+q(s.merch,"Merch Sales")+q(s.gas,"Gas Sales")+`<div class="section-label">Traffic & Avg Sale</div><div class="stat-card"><div class="stat-row"><div class="stat-name"><strong>Traffic Yesterday</strong></div><div class="stat-val">${fmtN(s.traffic.daily.ty)}</div><div class="stat-meta ${deltaClass(s.traffic.daily.inc)}">${fmtPct(s.traffic.daily.inc)}</div></div><div class="stat-row"><div class="stat-name"><strong>Traffic YTD</strong></div><div class="stat-val">${fmtN(s.traffic.ytd.ty)}</div><div class="stat-meta ${deltaClass(s.traffic.ytd.inc)}">${fmtPct(s.traffic.ytd.inc)}</div></div><div class="stat-row"><div class="stat-name"><strong>Avg Sale Yesterday</strong></div><div class="stat-val">$${s.avgSales.daily.ty}</div><div class="stat-meta ${deltaClass(s.avgSales.daily.inc)}">${fmtPct(s.avgSales.daily.inc)}</div></div><div class="stat-row"><div class="stat-name"><strong>Avg Sale YTD</strong></div><div class="stat-val">$${s.avgSales.ytd.ty}</div><div class="stat-meta ${deltaClass(s.avgSales.ytd.inc)}">${fmtPct(s.avgSales.ytd.inc)}</div></div></div>`},
lastweek:()=>{const w=DATA.lastWeek,wk=w.weekly;const vs=(a,b)=>{const d=a-b,p=b!==0?d/b:0;return`<span class="${deltaClass(d)}">${arrow(d)} ${fmtPct(p)}</span>`};return`<div class="section-label">${w.label}</div><div class="stat-card"><div class="stat-row"><div class="stat-name"><strong>Total Sales</strong><span>Plan ${fmt$(wk.totalSales.plan)} · LY ${fmt$(wk.totalSales.ly)}</span></div><div><div class="stat-val big">${fmt$(wk.totalSales.actual)}</div><div class="stat-meta">vs Plan ${vs(wk.totalSales.actual,wk.totalSales.plan)}</div><div class="stat-meta">vs LY ${vs(wk.totalSales.actual,wk.totalSales.ly)}</div></div></div><div class="stat-row"><div class="stat-name"><strong>Merch</strong></div><div><div class="stat-val">${fmt$(wk.merchSales.actual)}</div><div class="stat-meta">vs Plan ${vs(wk.merchSales.actual,wk.merchSales.plan)}</div></div></div><div class="stat-row"><div class="stat-name"><strong>Gas</strong></div><div><div class="stat-val">${fmt$(wk.gasSales.actual)}</div><div class="stat-meta">vs Plan ${vs(wk.gasSales.actual,wk.gasSales.plan)}</div></div></div><div class="stat-row"><div class="stat-name"><strong>Ancillary</strong></div><div><div class="stat-val">${fmt$(wk.ancillary.actual)}</div><div class="stat-meta">vs Plan ${vs(wk.ancillary.actual,wk.ancillary.plan)}</div></div></div></div><div class="section-label">Daily Breakdown</div><div class="week-strip">${w.days.map(d=>`<div class="day-cell"><div class="day-dow">${d.dow}</div><div class="day-num">${fmt$(d.total)}</div><div class="day-actual">${d.date}</div></div>`).join("")}</div><div class="section-label">Payroll Last Week</div><div class="stat-card"><div class="stat-row"><div class="stat-name"><strong>Hours</strong><span>Sch ${fmtN(wk.hours.schedule,0)} · LY ${fmtN(wk.hours.ly,0)}</span></div><div><div class="stat-val">${fmtN(wk.hours.actual,0)}</div><div class="stat-meta">vs Sch ${vs(wk.hours.actual,wk.hours.schedule)}</div></div></div><div class="stat-row"><div class="stat-name"><strong>Avg Wage</strong></div><div><div class="stat-val">$${wk.avgWage.actual.toFixed(2)}</div><div class="stat-meta">LY $${wk.avgWage.ly.toFixed(2)}</div></div></div><div class="stat-row"><div class="stat-name"><strong>OT Hours</strong></div><div><div class="stat-val">${wk.otHours.actual.toFixed(2)}</div><div class="stat-meta">LY ${wk.otHours.ly.toFixed(2)}</div></div></div><div class="stat-row"><div class="stat-name"><strong>Payroll % Merch</strong></div><div><div class="stat-val">${fmtPct(wk.pctMerch.actual,2)}</div><div class="stat-meta">Sch ${fmtPct(wk.pctMerch.schedule,2)} · LY ${fmtPct(wk.pctMerch.ly,2)}</div></div></div><div class="stat-row"><div class="stat-name"><strong>Payroll % Total</strong></div><div><div class="stat-val">${fmtPct(wk.pctTotal.actual,2)}</div><div class="stat-meta">Sch ${fmtPct(wk.pctTotal.schedule,2)} · LY ${fmtPct(wk.pctTotal.ly,2)}</div></div></div></div>`},
lastperiod:()=>{const lp=DATA.lastPeriod;const row=(l,o,b)=>`<div class="stat-row"><div class="stat-name"><strong>${l}</strong>${o.pct!==undefined?`<span>${fmtPctRaw(o.pct,2)} of sales</span>`:''}</div><div><div class="stat-val ${b?'big':''}">${fmt$(o.ty)}</div>${o.varLY!==undefined?`<div class="stat-meta ${deltaClass(o.varLY)}">${arrow(o.varLY)} ${fmtPctRaw(o.varLY,2)} vs LY</div>`:''}</div></div>`;const sR=(l,o)=>`<div class="stat-row"><div class="stat-name"><strong>${l}</strong><span>Bud ${fmt$(o.budget)} · LY ${fmt$(o.ly)}</span></div><div><div class="stat-val">${fmt$(o.ty)}</div><div class="stat-meta ${deltaClass(o.varBudgetPct)}">${arrow(o.varBudgetPct)} ${fmtPctRaw(o.varBudgetPct,2)} vs Bud</div><div class="stat-meta ${deltaClass(o.varLYPct)}">${arrow(o.varLYPct)} ${fmtPctRaw(o.varLYPct,2)} vs LY</div></div></div>`;return`<div class="section-label">${lp.label}</div><div class="stat-card">${row("Profit",lp.profit.total,1)}${row("Profit ex Gas",lp.profit.exGas)}${row("Profit ex Gas & Ecomm",lp.profit.exGasEcom)}${row("Controllable Profit",lp.profit.controllable)}</div><div class="section-label">Sales</div><div class="stat-card">${sR("Warehouse Sales",lp.sales.warehouse)}${sR("Merch Sales",lp.sales.merch)}${sR("Gas Sales",lp.sales.gas)}${sR("Ancillary",lp.sales.anc)}</div><div class="section-label">Margin</div><div class="stat-card">${row("Gross Profit",lp.margin.grossProfit)}${row("Merch Margin",lp.margin.merch)}</div><div class="section-label">Membership</div><div class="stat-card">${row("Total Membership",lp.members.total)}${row("Regular",lp.members.regular)}${row("Executive",lp.members.exec)}</div><div class="section-label">Controllables</div><div class="stat-card">${row("Salaries",lp.expenses.salaries)}${row("Benefits",lp.expenses.benefits)}${row("Workers Comp",lp.expenses.workersComp)}${row("Total Controllables",lp.expenses.totalControllables)}${row("Total Non-Controllables",lp.expenses.totalNonControll)}</div>`},
payroll:()=>{const p=DATA.payroll;return`<div class="section-label">PARIS — Current Week (WTD)</div><div class="stat-card"><div class="stat-row"><div class="stat-name"><strong>Merch Payroll %</strong><span>Plan ${fmtPctRaw(p.pctPlan*100,2)}</span></div><div><div class="stat-val big">${fmtPctRaw(p.pctActual*100,2)}</div><div class="stat-meta ${p.pctVarPlan>0?'delta-neg':'delta-pos'}">${p.pctVarPlan>0?'+':''}${p.pctVarPlan} bps vs Plan</div><div class="stat-meta ${p.pctVarLY>0?'delta-neg':'delta-pos'}">${p.pctVarLY>0?'+':''}${p.pctVarLY} bps vs LY</div></div></div></div><div class="section-label">Hours</div><div class="stat-card"><div class="stat-row"><div class="stat-name"><strong>Actual Hours</strong><span>Sch ${fmtN(p.hoursSchedule)} · Plan ${fmtN(p.hoursPlan)}</span></div><div><div class="stat-val">${fmtN(p.hoursActual)}</div><div class="stat-meta ${p.hoursVarPlan<0?'delta-pos':'delta-neg'}">${p.hoursVarPlan>0?'+':''}${fmtN(p.hoursVarPlan)} vs Plan</div><div class="stat-meta ${p.hoursIncLY<0?'delta-pos':'delta-neg'}">${fmtPct(p.hoursIncLY)} vs LY</div></div></div><div class="stat-row"><div class="stat-name"><strong>OT Hours (ex Sun & SNE)</strong></div><div><div class="stat-val">${p.otActual.toFixed(2)}</div><div class="stat-meta">SNE ${p.otSNE.toFixed(2)}</div></div></div><div class="stat-row"><div class="stat-name"><strong>Hours to Cut</strong><span>to hit merch pay%</span></div><div><div class="stat-val ${p.hoursToCut>0?'delta-warn':'delta-pos'}">${p.hoursToCut>0?fmtN(p.hoursToCut):'Under '+fmtN(Math.abs(p.hoursToCut))}</div></div></div></div><div class="section-label">Dollars</div><div class="stat-card"><div class="stat-row"><div class="stat-name"><strong>Actual $</strong><span>Sch ${fmt$(p.dollarsSchedule)} · Plan ${fmt$(p.dollarsPlan)}</span></div><div><div class="stat-val">${fmt$(p.dollarsActual)}</div><div class="stat-meta ${p.dollarsVarPlan<0?'delta-pos':'delta-neg'}">${p.dollarsVarPlan>0?'+':''}${fmt$(p.dollarsVarPlan)} vs Plan</div></div></div><div class="stat-row"><div class="stat-name"><strong>$ to Cut</strong><span>to hit merch pay%</span></div><div><div class="stat-val ${p.dollarsToCut>0?'delta-warn':'delta-pos'}">${p.dollarsToCut>0?fmt$(p.dollarsToCut):'Under '+fmt$(Math.abs(p.dollarsToCut))}</div></div></div><div class="stat-row"><div class="stat-name"><strong>Avg Wage</strong></div><div><div class="stat-val">$${p.avgWage.toFixed(2)}</div></div></div><div class="stat-row"><div class="stat-name"><strong>Productivity</strong><span>sales per hour</span></div><div><div class="stat-val">$${p.productivity}</div></div></div></div><div class="section-label">Staff Mix</div><div class="stat-card"><div class="stat-row"><div class="stat-name"><strong>Full Time</strong></div><div><div class="stat-val">${DATA.membership.ftpt.ft}</div><div class="stat-meta">${fmtPct(DATA.membership.ftpt.ftPct)}</div></div></div><div class="stat-row"><div class="stat-name"><strong>Part Time</strong></div><div><div class="stat-val">${DATA.membership.ftpt.pt}</div><div class="stat-meta">${fmtPct(DATA.membership.ftpt.ptPct)}</div></div></div><div class="stat-row"><div class="stat-name"><strong>Limited Part Time</strong></div><div><div class="stat-val">${DATA.membership.ftpt.lpt}</div></div></div></div>`},

fresh:()=>`<div class="toggle-row" id="freshToggle"><div class="toggle active" data-cat="overview">All</div><div class="toggle" data-cat="meat">Meat</div><div class="toggle" data-cat="bakery">Bakery</div><div class="toggle" data-cat="deli">Deli</div><div class="toggle" data-cat="produce">Produce</div><div class="toggle" data-cat="foodCourt">Food Ct</div></div><div id="freshContent">${freshContent("overview")}</div>`,
shrink:()=>{const s=DATA.shrink,d=[...DATA.shrinkDetail].sort((a,b)=>b.ytdPct-a.ytdPct);return`<div class="section-label">D&D YTD by Category</div>${s.map(r=>`<div class="dept-row"><div class="dept-name">${r.name}</div><div class="dept-sales">${fmt$(r.ddYtd*1000)}</div><div class="dept-inc ${r.ddPctYtd>.02?'delta-neg':''}">${fmtPctRaw(r.ddPctYtd*100,2)}</div></div>`).join("")}<div class="section-label">Top D&D % by Dept (YTD)</div>${d.map(r=>`<div class="dept-row"><div class="dept-name">${r.name}</div><div class="dept-sales">${fmt$(r.ytd*1000)}</div><div class="dept-inc ${r.ytdPct>.02?'delta-neg':''}">${fmtPctRaw(r.ytdPct*100,2)}</div></div>`).join("")}`},
ancillary:()=>{const a=DATA.ancillary;const c=(l,o)=>`<div class="stat-card"><div class="stat-row"><div class="stat-name"><strong>${l}</strong><span>Last Period</span></div><div><div class="stat-val">${fmt$(o.sales)}</div></div></div><div class="stat-row"><div class="stat-name"><strong>Profit</strong><span>${fmtPctRaw(o.profitPct,2)} of sales</span></div><div><div class="stat-val ${o.profit<0?'delta-neg':'delta-pos'}">${fmt$(o.profit)}</div></div></div><div class="stat-row"><div class="stat-name"><strong>YTD</strong></div><div><div class="stat-val">${fmt$(o.ytdSales)}</div><div class="stat-meta ${o.ytdProfit<0?'delta-neg':'delta-pos'}">Profit ${fmt$(o.ytdProfit)}</div></div></div></div>`;return`<div class="section-label">Gasoline</div>${c("Gas",a.gasoline)}<div class="section-label">Pharmacy</div>${c("Pharmacy Rx",a.pharmRx)}${c("Pharmacy OTC",a.pharmOtc)}<div class="section-label">Optical & Hearing</div>${c("Optical",a.optical)}${c("Hearing Aids",a.hearing)}`}
};

function catGroupList(){
return Object.entries(DATA.categories).map(([g,cats])=>{
const tops=cats.filter(c=>!c.n.startsWith("  "));
const total=tops.reduce((s,c)=>s+(catState.period==="wtd"?c.wtd:c.ytd),0);
const exp=catState.expanded===g;
return`<div class="cat-group" data-group="${g}"><div class="cat-group-head"><div class="cat-group-name">${exp?'▼':'▶'} ${g}</div><div class="cat-group-meta">${fmt$(total)} · ${tops.length} depts</div></div>${exp?'<div style="margin-top:10px">'+cats.map(c=>catRow(c)).join("")+'</div>':''}</div>`;
}).join("");
}

function catRow(c){
const sales=catState.period==="wtd"?c.wtd:c.ytd;
const inc=catState.period==="wtd"?c.wtdI:c.ytdI;
const isSub=c.n.startsWith("  ");
return`<div class="cat-row" style="${isSub?'margin-left:14px;':''}"><div class="cat-rname">${c.n.trim()}</div><div class="cat-rsales">${fmt$(sales)}</div><div class="cat-rinc ${deltaClass(inc)}">${inc!==0?arrow(inc)+' '+fmtPct(inc,1):'—'}</div><div class="cat-roh">${c.oh>0?'OH '+fmtN(c.oh):''}</div></div>`;
}

function memPer(p){const m=DATA.membership[p];const r=(l,v,i,pct=false,cnt=false)=>{if(v===undefined)return"";const d=pct?fmtPct(v,1):(cnt?fmtN(v):fmt$(v));return`<div class="stat-row"><div class="stat-name"><strong>${l}</strong></div><div><div class="stat-val">${d}</div>${i!==undefined?`<div class="stat-meta ${deltaClass(i)}">${fmtPct(i)} vs LY</div>`:""}</div></div>`};return`<div class="stat-card">${r("Member Income",m.memberIncome.ty,m.memberIncome.inc)}${r("Gold Signups",m.goldSignups.ty,m.goldSignups.inc,false,true)}${r("Business Signups",m.bizSignups.ty,m.bizSignups.inc,false,true)}${r("Reactivations",m.reactivations.ty,m.reactivations.inc,false,true)}${r("Total Signups+Reactivations",m.total.ty,m.total.inc,false,true)}</div><div class="stat-card">${r("New Member Exec %",m.newMemberExecPct.ty,m.newMemberExecPct.inc,true)}${r("Exec Upgrades",m.execUpgrades.ty,m.execUpgrades.inc,false,true)}${r("Triple Play %",m.triplePlay.ty,m.triplePlay.inc,true)}${r("NMAR %",m.nmarPct.ty,m.nmarPct.inc,true)}</div><div class="stat-card">${r("Credit Card Apps",m.creditCardApps.ty,m.creditCardApps.inc,false,true)}${r("New Member CC %",m.newMemberCCPct.ty,m.newMemberCCPct.inc,true)}${r("New Member Email %",m.newMemberEmailPct.ty,m.newMemberEmailPct.inc,true)}</div>`}

function deptList(p){const ik=p==="daily"?null:p+"Inc";const s=[...DATA.departments].sort((a,b)=>parseInt(a.code)-parseInt(b.code));return s.map(d=>{const v=d[p],i=ik?d[ik]:null;return`<div class="dept-row"><div class="dept-name">${d.code} ${d.name}</div><div class="dept-sales">${fmt$(v)}</div><div class="dept-inc ${i!==null?deltaClass(i):''}">${i!==null?fmtPct(i):'—'}</div></div>`}).join("")}

function freshContent(cat){const f=DATA.fresh;if(cat==="overview"){const cats=[{key:"meat",label:"Meat",data:f.meat},{key:"bakery",label:"Bakery",data:f.bakery},{key:"deli",label:"Service Deli",data:f.deli},{key:"produce",label:"Produce",data:f.produce},{key:"foodCourt",label:"Food Court",data:f.foodCourt}];return`<div class="section-label">Fresh Total — Last Period (P9)</div><div class="stat-card"><div class="stat-row"><div class="stat-name"><strong>Total Fresh Sales</strong><span>LY ${fmt$(f.total.sales.ly)}</span></div><div><div class="stat-val big">${fmt$(f.total.sales.ty)}</div><div class="stat-meta ${deltaClass(f.total.sales.varLY)}">${arrow(f.total.sales.varLY)} ${fmtPctRaw(f.total.sales.varLY,2)} vs LY</div></div></div><div class="stat-row"><div class="stat-name"><strong>YTD Sales</strong></div><div><div class="stat-val">${fmt$(f.total.ytdSales.ty)}</div><div class="stat-meta ${deltaClass(f.total.ytdSales.varLY)}">${fmtPctRaw(f.total.ytdSales.varLY,2)} vs LY</div></div></div><div class="stat-row"><div class="stat-name"><strong>Net Margin</strong><span>${fmtPctRaw(f.total.netMargin.pct,2)} of sales</span></div><div><div class="stat-val">${fmt$(f.total.netMargin.ty)}</div><div class="stat-meta ${deltaClass(f.total.netMargin.varLY)}">${fmtPctRaw(f.total.netMargin.varLY,2)} vs LY</div></div></div></div><div class="section-label">By Category — Last Period</div>${cats.map(c=>`<div class="dept-row"><div class="dept-name">${c.label}</div><div class="dept-sales">${fmt$(c.data.sales.ty)}</div><div class="dept-inc ${deltaClass(c.data.sales.varLY)}">${arrow(c.data.sales.varLY)} ${fmtPctRaw(c.data.sales.varLY,1)}</div></div>`).join("")}`}const d=f[cat];const name=({meat:"Meat",bakery:"Bakery",deli:"Service Deli",produce:"Produce",foodCourt:"Food Court"})[cat];if(cat==="foodCourt"){return`<div class="section-label">${name} — Last Period (P9)</div><div class="stat-card"><div class="stat-row"><div class="stat-name"><strong>Sales</strong></div><div><div class="stat-val big">${fmt$(d.sales.ty)}</div><div class="stat-meta ${deltaClass(d.sales.varLY)}">${arrow(d.sales.varLY)} ${fmtPctRaw(d.sales.varLY,2)} vs LY</div></div></div><div class="stat-row"><div class="stat-name"><strong>YTD Sales</strong></div><div><div class="stat-val">${fmt$(d.ytdSales.ty)}</div></div></div></div><div class="section-label">Margin & Payroll</div><div class="stat-card"><div class="stat-row"><div class="stat-name"><strong>Gross Margin</strong></div><div><div class="stat-val">${fmt$(d.grossMargin.ty)}</div><div class="stat-meta">${fmtPctRaw(d.grossMargin.pct,2)}%</div></div></div><div class="stat-row"><div class="stat-name"><strong>Payroll</strong></div><div><div class="stat-val">${fmt$(d.payroll.ty)}</div></div></div><div class="stat-row"><div class="stat-name"><strong>Profit</strong></div><div><div class="stat-val ${d.profit.ty<0?'delta-neg':'delta-pos'}">${fmt$(d.profit.ty)}</div></div></div></div><div class="section-label">Top 10 Items WTD</div>${d.topItems.map(i=>`<div class="top-item"><div class="rank">#${i.rank}</div><div class="item-name">${i.name}<div style="font-size:11px;color:var(--muted);margin-top:2px">${fmtN(i.units)} units</div></div><div class="item-sales">${fmt$(i.sales)}</div></div>`).join("")}`}return`<div class="section-label">${name} — Last Period (P9)</div><div class="stat-card"><div class="stat-row"><div class="stat-name"><strong>Sales</strong></div><div><div class="stat-val big">${fmt$(d.sales.ty)}</div><div class="stat-meta ${deltaClass(d.sales.varLY)}">${arrow(d.sales.varLY)} ${fmtPctRaw(d.sales.varLY,2)} vs LY</div></div></div><div class="stat-row"><div class="stat-name"><strong>YTD Sales</strong></div><div><div class="stat-val">${fmt$(d.ytdSales.ty)}</div></div></div></div><div class="section-label">Margin</div><div class="stat-card"><div class="stat-row"><div class="stat-name"><strong>Net Margin</strong></div><div><div class="stat-val">${fmt$(d.netMargin.ty)}</div><div class="stat-meta">${fmtPctRaw(d.netMargin.pct,2)}%</div></div></div>${d.payroll.ty!==0?`<div class="stat-row"><div class="stat-name"><strong>Payroll</strong></div><div><div class="stat-val">${fmt$(d.payroll.ty)}</div></div></div>`:''}<div class="stat-row"><div class="stat-name"><strong>D&D</strong></div><div><div class="stat-val ${d.dd.ty<0?'delta-neg':''}">${fmt$(d.dd.ty)}</div></div></div></div><div class="section-label">Top 10 Items WTD</div>${d.topItems.map(i=>`<div class="top-item"><div class="rank">#${i.rank}</div><div class="item-name">${i.name}<div style="font-size:11px;color:var(--muted);margin-top:2px">${fmtN(i.units)} units</div></div><div class="item-sales">${fmt$(i.sales)}</div></div>`).join("")}`}

function buildSearchIndex(){
const idx=[];const s=DATA.sales;
idx.push({k:["yesterday","daily"],l:"Total Sales — Yesterday",v:fmt$full(s.daily.ty),s:`${fmtPct(s.daily.inc)} vs LY`});
idx.push({k:["wtd","running"],l:"Total Sales — Running Wk",v:fmt$full(s.wtd.ty),s:`${fmtPct(s.wtd.inc)} vs LY`});
idx.push({k:["ptd"],l:"Total Sales — PTD",v:fmt$full(s.ptd.ty),s:`${fmtPct(s.ptd.inc)} vs LY`});
idx.push({k:["ytd","year"],l:"Total Sales — YTD",v:fmt$full(s.ytd.ty),s:`${fmtPct(s.ytd.inc)} vs LY`});
idx.push({k:["traffic"],l:"Traffic — Yesterday",v:fmtN(s.traffic.daily.ty),s:`${fmtPct(s.traffic.daily.inc)} vs LY`});
idx.push({k:["avg sale","basket"],l:"Avg Sale — Yesterday",v:"$"+s.avgSales.daily.ty,s:`${fmtPct(s.avgSales.daily.inc)} vs LY`});
const w=DATA.lastWeek.weekly;
idx.push({k:["last week","lw"],l:"Last Week Total",v:fmt$full(w.totalSales.actual),s:`Plan ${fmt$(w.totalSales.plan)}`});
idx.push({k:["last week wage"],l:"Last Week Avg Wage",v:"$"+w.avgWage.actual.toFixed(2),s:`LY $${w.avgWage.ly.toFixed(2)}`});
const lp=DATA.lastPeriod;
idx.push({k:["last period","p9"],l:"Last Period Profit",v:fmt$full(lp.profit.total.ty),s:`${fmtPctRaw(lp.profit.total.varLY,1)}% vs LY`});
const p=DATA.payroll;
idx.push({k:["wage","avg wage"],l:"Avg Wage (WTD)",v:"$"+p.avgWage.toFixed(2),s:""});
idx.push({k:["payroll %","merch pay"],l:"Merch Payroll %",v:fmtPctRaw(p.pctActual*100,2),s:`Plan ${fmtPctRaw(p.pctPlan*100,2)}`});
idx.push({k:["ot","overtime"],l:"OT Hours",v:p.otActual.toFixed(2),s:""});
idx.push({k:["hours to cut"],l:"Hours to Cut",v:p.hoursToCut>0?fmtN(p.hoursToCut):'Under '+fmtN(Math.abs(p.hoursToCut)),s:"to hit merch pay%"});
idx.push({k:["productivity"],l:"Productivity",v:"$"+p.productivity,s:"per hour"});
const m=DATA.membership;
idx.push({k:["signups"],l:"Signups+React PTD",v:fmtN(m.ptd.total.ty),s:`${fmtPct(m.ptd.total.inc)} vs LY`});
idx.push({k:["exec upgrades"],l:"Exec Upgrades PTD",v:fmtN(m.ptd.execUpgrades.ty),s:""});
idx.push({k:["nmar"],l:"New Member Exec %",v:fmtPct(m.ptd.newMemberExecPct.ty),s:""});
idx.push({k:["ft","full time"],l:"Full Time",v:m.ftpt.ft,s:fmtPct(m.ftpt.ftPct)});
idx.push({k:["pt","part time"],l:"Part Time",v:m.ftpt.pt,s:fmtPct(m.ftpt.ptPct)});
const f=DATA.fresh;
idx.push({k:["meat"],l:"Meat Sales (P9)",v:fmt$full(f.meat.sales.ty),s:`${fmtPctRaw(f.meat.sales.varLY,1)}% vs LY`});
idx.push({k:["bakery"],l:"Bakery Sales (P9)",v:fmt$full(f.bakery.sales.ty),s:`${fmtPctRaw(f.bakery.sales.varLY,1)}% vs LY`});
idx.push({k:["deli","service deli"],l:"Deli Sales (P9)",v:fmt$full(f.deli.sales.ty),s:`${fmtPctRaw(f.deli.sales.varLY,1)}% vs LY`});
idx.push({k:["produce"],l:"Produce Sales (P9)",v:fmt$full(f.produce.sales.ty),s:`${fmtPctRaw(f.produce.sales.varLY,1)}% vs LY`});
idx.push({k:["food court","fc"],l:"Food Court Sales (P9)",v:fmt$full(f.foodCourt.sales.ty),s:`${fmtPctRaw(f.foodCourt.sales.varLY,1)}% vs LY`});
DATA.departments.forEach(d=>{idx.push({k:[d.name.toLowerCase(),d.code],l:`${d.code} ${d.name} PTD`,v:fmt$full(d.ptd),s:`${fmtPct(d.ptdInc)} vs LY · YTD ${fmt$(d.ytd)}`})});
Object.entries(DATA.categories).forEach(([group,cats])=>{cats.forEach(c=>{const name=c.n.trim();idx.push({k:[name.toLowerCase()],l:`${name}`,v:fmt$full(c.wtd),s:`WTD · ${fmtPct(c.wtdI,1)} vs LY · OH ${fmtN(c.oh||0)}`})})});
const a=DATA.ancillary;
idx.push({k:["pharmacy","rx"],l:"Pharmacy Rx (P9)",v:fmt$full(a.pharmRx.sales),s:`Profit ${fmt$(a.pharmRx.profit)}`});
idx.push({k:["pharm otc","otc"],l:"Pharmacy OTC (P9)",v:fmt$full(a.pharmOtc.sales),s:`Profit ${fmt$(a.pharmOtc.profit)}`});
idx.push({k:["optical"],l:"Optical (P9)",v:fmt$full(a.optical.sales),s:`Profit ${fmt$(a.optical.profit)}`});
idx.push({k:["hearing"],l:"Hearing Aids (P9)",v:fmt$full(a.hearing.sales),s:`Profit ${fmt$(a.hearing.profit)}`});
return idx;
}

const searchIndex=buildSearchIndex();

function doSearch(q){q=q.toLowerCase().trim();if(!q)return[];const toks=q.split(/\s+/);const m=searchIndex.filter(i=>toks.every(t=>i.k.some(k=>k.includes(t))||i.l.toLowerCase().includes(t)));m.sort((a,b)=>{const aS=a.k.some(k=>k.startsWith(q))||a.l.toLowerCase().startsWith(q);const bS=b.k.some(k=>k.startsWith(q))||b.l.toLowerCase().startsWith(q);if(aS&&!bS)return-1;if(bS&&!aS)return 1;return a.l.length-b.l.length});return m.slice(0,12)}

document.getElementById("dataAsOf").innerHTML=`Dash ${DATA.asOfDashboard} · PARIS ${DATA.asOfParis}<br>P&L ${DATA.asOfFinancial} · Cat ${DATA.asOfCategories}`;

document.querySelectorAll(".tile").forEach(t=>{t.addEventListener("click",()=>{renderPanel(t.dataset.panel);document.getElementById("panelView").classList.add("active");setTimeout(attach,30)})});
document.getElementById("backBtn").addEventListener("click",()=>{document.getElementById("panelView").classList.remove("active")});

function attach(){
const mT=document.getElementById("memToggle");
if(mT){mT.querySelectorAll(".toggle").forEach(t=>{t.addEventListener("click",()=>{mT.querySelectorAll(".toggle").forEach(x=>x.classList.remove("active"));t.classList.add("active");document.getElementById("memContent").innerHTML=memPer(t.dataset.period)})})}
const dT=document.getElementById("deptToggle");
if(dT){dT.querySelectorAll(".toggle").forEach(t=>{t.addEventListener("click",()=>{dT.querySelectorAll(".toggle").forEach(x=>x.classList.remove("active"));t.classList.add("active");document.getElementById("deptList").innerHTML=deptList(t.dataset.period)})})}
const fT=document.getElementById("freshToggle");
if(fT){fT.querySelectorAll(".toggle").forEach(t=>{t.addEventListener("click",()=>{fT.querySelectorAll(".toggle").forEach(x=>x.classList.remove("active"));t.classList.add("active");document.getElementById("freshContent").innerHTML=freshContent(t.dataset.cat)})})}
const cT=document.getElementById("catToggle");
if(cT){cT.querySelectorAll(".toggle").forEach(t=>{t.addEventListener("click",()=>{catState.period=t.dataset.period;cT.querySelectorAll(".toggle").forEach(x=>x.classList.remove("active"));t.classList.add("active");document.getElementById("catContent").innerHTML=catGroupList();attachCatGroups()})});attachCatGroups()}
}

function attachCatGroups(){
document.querySelectorAll(".cat-group").forEach(g=>{g.addEventListener("click",()=>{const gn=g.dataset.group;catState.expanded=catState.expanded===gn?null:gn;document.getElementById("catContent").innerHTML=catGroupList();attachCatGroups()})})
}

const searchEl=document.getElementById("search"),resultsEl=document.getElementById("results");
searchEl.addEventListener("input",()=>{const q=searchEl.value;if(!q.trim()){resultsEl.classList.remove("active");resultsEl.innerHTML="";return}const m=doSearch(q);if(m.length===0){resultsEl.innerHTML='<div class="empty">No matches.</div>'}else{resultsEl.innerHTML=m.map(x=>`<div class="result"><div class="result-label"><strong>${x.l}</strong>${x.s?`<span style="font-size:12px;color:var(--muted)">${x.s}</span>`:''}</div><div class="result-value">${x.v}</div></div>`).join("")}resultsEl.classList.add("active")});
searchEl.addEventListener("focus",()=>{if(searchEl.value.trim())resultsEl.classList.add("active")});
</script>
</body>
</html>
