  .title small { color:var(--muted); font-weight:500; font-size:12px; margin-left:6px; }
  .data-as-of { font-size:11px; color:var(--muted); text-align:right; }

  .search:focus { border-color:var(--accent); }
  .search::placeholder { color:#666; }
  .results { display:none; margin-top:8px; background:var(--panel); border-radius:14px; overflow:hidden; }
  .results.active { display:block; }
  .result { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .result:last-child { border-bottom:none; }
  .result-label { font-size:14px; color:var(--muted); flex:1; min-width:0; }
  .result-label strong { color:var(--text); display:block; font-size:16px; font-weight:600; margin-bottom:2px; }
  .result-value { font-size:20px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tiles { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-top:4px; }
  .tile { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px 14px; cursor:pointer; transition:transform .08s, background .15s; text-align:left; }
  .tile:active { transform:scale(0.97); background:var(--panel-2); }
  .tile-icon { font-size:22px; margin-bottom:8px; }
  .tile-name { font-size:15px; font-weight:700; letter-spacing:-0.01em; }
  .tile-hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .panel-view { position:fixed; inset:0; background:var(--bg); transform:translateY(100%); transition:transform .25s ease; z-index:50; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top, 12px); }

  .panel-header { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--border); }
  .panel-title { font-size:18px; font-weight:700; }
  .back-btn { background:var(--panel); border:none; color:var(--text); padding:8px 14px; border-radius:10px; font-size:15px; font-weight:600; }
  .panel-body { overflow-y:auto; flex:1; padding:14px; -webkit-overflow-scrolling:touch; }
  .section-label { font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin:16px 0 8px; padding:0 2px; }
  .section-label:first-child { margin-top:0; }
  .stat-card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:8px; }
  .stat-row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .stat-row + .stat-row { margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .stat-name { font-size:14px; color:var(--muted); flex:1; }
  .stat-name strong { display:block; color:var(--text); font-size:16px; font-weight:600; margin-bottom:2px; }
  .stat-name span { font-size:11px; }
  .stat-val { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; }
  .stat-val.big { font-size:28px; }
  .stat-meta { font-size:12px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
  .delta-pos { color:var(--green); }
  .delta-neg { color:var(--red); }
  .delta-warn { color:var(--amber); }
  .quad { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .quad-cell { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; }
  .quad-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; font-weight:600; }
  .quad-val { font-size:22px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; }
  .quad-sub { font-size:12px; margin-top:2px; font-variant-numeric:tabular-nums; }
  .dept-row { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:baseline; padding:10px 14px; background:var(--panel); border:1px solid var(--border); border-radius:10px; margin-bottom:6px; }
  .dept-name { font-size:14px; font-weight:600; }
  .dept-sales { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
  .dept-inc { font-size:13px; font-variant-numeric:tabular-nums; min-width:60px; text-align:right; }
  .toggle-row { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .toggle { flex:1; padding:9px 6px; background:var(--panel); border:1px solid var(--border); border-radius:10px; color:var(--muted); font-size:12px; font-weight:600; text-align:center; cursor:pointer; min-width:0; }
  .toggle.active { background:var(--accent); color:#000; border-color:var(--accent); }
  .week-strip { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; margin-bottom:8px; }
  .day-cell { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px 4px; text-align:center; }
  .day-dow { font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; }
  .day-num { font-size:13px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .day-actual { font-size:9px; color:var(--muted); margin-top:2px; }
  .save-btn { width:100%; padding:14px; background:var(--green); color:#000; border:none; border-radius:12px; font-weight:700; font-size:16px; margin-top:12px; }
  .note { font-size:12px; color:var(--muted); margin:8px 0; line-height:1.5; }
  .empty { padding:20px; text-align:center; color:var(--muted); font-size:14px; }
  .top-item { padding:8px 12px; background:var(--panel); border:1px solid var(--border); border-radius:8px; margin-bottom:4px; display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:baseline; }
  .rank { color:var(--muted); font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; min-width:22px; }
  .item-name { font-size:13px; font-weight:500; min-width:0; word-break:break-word; }
  .item-sales { font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; text-align:right; }
  input[type=number] { width:100%; padding:10px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:16px; }
</style>

const fmt$ = n => { if(n==null||isNaN(n))return "—"; const a=Math.abs(n),s=n<0?"-":""; if(a>=1e6)return s+"$"+(a/1e6).toFixed(2)+"M"; if(a>=1e3)return s+"$"+(a/1e3).toFixed(1)+"K"; return s+"$"+Math.round(a).toLocaleString(); };
const fmt$full = n => { if(n==null||isNaN(n))return "—"; return (n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString(); };
const fmtN = (n,dec=0) => { if(n==null||isNaN(n))return "—"; return Number(n).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec}); };
const fmtPct = (n,dec=1) => { if(n==null||isNaN(n))return "—"; return (n*100).toFixed(dec)+"%"; };
const fmtPctRaw = (n,dec=1) => { if(n==null||isNaN(n))return "—"; return Number(n).toFixed(dec)+"%"; };
const deltaClass = (n,inv=false) => { if(n===0||n==null)return ""; return (inv?n<0:n>0)?"delta-pos":"delta-neg"; };
const arrow = n => n>0?"▲":n<0?"▼":"·";

function panelTitle(p) {
  return ({sales:"Sales",lastweek:"Last Week",lastperiod:"Last Period (P9)",payroll:"Payroll",membership:"Membership",depts:"Departments",fresh:"Fresh",shrink:"Shrink & D&D",ancillary:"Ancillary"})[p]||"";
}

function renderPanel(name) {
  document.getElementById("panelTitle").textContent = panelTitle(name);
  document.getElementById("panelBody").innerHTML = panelHTML[name]();
  document.getElementById("panelBody").scrollTop = 0;
}

function membershipPeriod(p) {
  const m = DATA.membership[p];
  const row = (lbl,val,inc,isPct=false,isCount=false) => {
    if (val===undefined) return "";

    return `<div class="stat-row"><div class="stat-name"><strong>${lbl}</strong></div><div><div class="stat-val">${display}</div>${inc!==undefined?`<div class="stat-meta ${deltaClass(inc)}">${fmtPct(inc)} vs LY</div>`:""}</div></div>`;

  return `
    <div class="stat-card">
      ${row("Member Income",m.memberIncome.ty,m.memberIncome.inc)}

function deptList(period) {
  const incKey = period==="daily" ? null : period+"Inc";
  const sorted = [...DATA.departments].sort((a,b) => parseInt(a.code)-parseInt(b.code));
  return sorted.map(d => {
    const val = d[period], inc = incKey ? d[incKey] : null;
    return `<div class="dept-row"><div class="dept-name">${d.code} ${d.name}</div><div class="dept-sales">${fmt$(val)}</div><div class="dept-inc ${inc!==null?deltaClass(inc):''}">${inc!==null?fmtPct(inc):'—'}</div></div>`;
  }).join("");
}

const searchIndex = buildSearchIndex();

function search(q) {
  q = q.toLowerCase().trim();
  if (!q) return [];
  const tokens = q.split(/\s+/);
  const matches = searchIndex.filter(item =>
    tokens.every(t => item.keys.some(k => k.includes(t)) || item.label.toLowerCase().includes(t))
  );
  matches.sort((a,b) => {
    const aS = a.keys.some(k=>k.startsWith(q)) || a.label.toLowerCase().startsWith(q);
    const bS = b.keys.some(k=>k.startsWith(q)) || b.label.toLowerCase().startsWith(q);
    if (aS && !bS) return -1;
    if (bS && !aS) return 1;
    return a.label.length - b.label.length;
  });
  return matches.slice(0, 12);
}

document.getElementById("dataAsOf").innerHTML = `Dash ${DATA.asOfDashboard} · PARIS ${DATA.asOfParis}<br>P&L ${DATA.asOfFinancial}`;

document.querySelectorAll(".tile").forEach(t => {
  t.addEventListener("click", () => {
    renderPanel(t.dataset.panel);
    document.getElementById("panelView").classList.add("active");
    setTimeout(attachPanelInteractions, 30);
  });
});

document.getElementById("backBtn").addEventListener("click", () => {
  document.getElementById("panelView").classList.remove("active");
});

function attachPanelInteractions() {
  const memToggle = document.getElementById("memToggle");
  if (memToggle) {
    memToggle.querySelectorAll(".toggle").forEach(t => {
      t.addEventListener("click", () => {
        memToggle.querySelectorAll(".toggle").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        document.getElementById("memContent").innerHTML = membershipPeriod(t.dataset.period);
      });
    });
  }
  const deptToggle = document.getElementById("deptToggle");
  if (deptToggle) {
    deptToggle.querySelectorAll(".toggle").forEach(t => {
      t.addEventListener("click", () => {
        deptToggle.querySelectorAll(".toggle").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        document.getElementById("deptList").innerHTML = deptList(t.dataset.period);
      });
    });
  }
  const freshToggle = document.getElementById("freshToggle");
  if (freshToggle) {
    freshToggle.querySelectorAll(".toggle").forEach(t => {
      t.addEventListener("click", () => {
        freshToggle.querySelectorAll(".toggle").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        document.getElementById("freshContent").innerHTML = freshContent(t.dataset.cat);
      });
    });
  }
}

const searchEl = document.getElementById("search");
const resultsEl = document.getElementById("results");

searchEl.addEventListener("input", () => {
  const q = searchEl.value;
  if (!q.trim()) { resultsEl.classList.remove("active"); resultsEl.innerHTML = ""; return; }
  const matches = search(q);
  if (matches.length === 0) {
    resultsEl.innerHTML = '<div class="empty">No matches. Try "yesterday", "wage", "meat", "last period".</div>';
  } else {
    resultsEl.innerHTML = matches.map(m => `<div class="result"><div class="result-label"><strong>${m.label}</strong>${m.sub?`<span style="font-size:12px;color:var(--muted)">${m.sub}</span>`:''}</div><div class="result-value">${m.value}</div></div>`).join("");
  }
  resultsEl.classList.add("active");
});

searchEl.addEventListener("focus", () => {
  if (searchEl.value.trim()) resultsEl.classList.add("active");
});


(async () => {
  try {
    if (window.storage) {
      const stored = await window.storage.get("walkbook_data");
      if (stored && stored.value) Object.assign(DATA, JSON.parse(stored.value));
    }
  } catch(e) {}
})();
</script>
